[project]
name = "agroAdvisor"
version = "1.0.0"
description = "Jac client application: agroAdvisor"
entry-point = "main.jac"

[dependencies.npm]
date-fns = "latest"
lucide-react = "latest"
react-router-dom = "latest"
react = "^18.2.0"
react-dom = "^18.2.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
tailwindcss = "latest"
"@tailwindcss/vite" = "latest"
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[plugins.client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[typecheck]
enabled = false
exclude = ["agroAdvisor/components/**", "agroAdvisor/app.cl.jac"]
[plugins.scale]