# nginx.conf

events {}

http {
    server {
        # Nginx listens on 8000 (Railway will forward to this)
        listen 8000;
        server_name _;

        # Root path: directly serve the Jac page /page/app
        location = / {
            proxy_pass http://127.0.0.1:8001/page/app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else: just proxy to Jac normally
        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
