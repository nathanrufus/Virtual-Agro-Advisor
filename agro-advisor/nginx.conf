
events {}

http {
    server {
        # Nginx listens on 8000 (this is what Railway/host will see)
        listen 8000;
        server_name _;

        # When someone hits the root, send them to the app page
        location = / {
            return 302 /page/app#/;
        }

        # Everything else is proxied to the Jac server on 8001
        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
